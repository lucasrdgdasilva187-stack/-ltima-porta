<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Thronepath · v1.6.4 Alpha</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#080808;color:#fff;z-index:2;text-align:center;padding:24px}
#bar{width:min(460px,80vw);height:10px;background:#2b2b2b;border-radius:999px;overflow:hidden;margin:14px auto 0}
#fill{height:100%;width:0;background:#d7aa35;transition:width .15s}
small{opacity:.72}
</style>
</head>
<body>
<div id="loading"><div><strong>THRONEPATH</strong><br><small>Carregando o jogo…</small><div id="bar"><div id="fill"></div></div></div></div>
<iframe id="game" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
<script>
const files=["chunks/000.txt","chunks/001.txt","chunks/002.txt","chunks/003.txt","chunks/004.txt","chunks/005.txt","chunks/006.txt","chunks/007.txt","chunks/008.txt","chunks/009.txt","chunks/010.txt","chunks/011.txt","chunks/012.txt","chunks/013.txt","chunks/014.txt","chunks/015.txt","chunks/016.txt","chunks/017.txt","chunks/018.txt","chunks/019.txt","chunks/020.txt","chunks/021.txt","chunks/022.txt"];
(async()=>{
  try{
    const parts=[];
    for(let i=0;i<files.length;i++){
      const r=await fetch(files[i],{cache:"force-cache"});
      if(!r.ok) throw new Error("Falha ao carregar parte "+(i+1));
      parts.push(await r.text());
      document.getElementById("fill").style.width=((i+1)/files.length*100)+"%";
    }
    const html=parts.join("");
    const url=URL.createObjectURL(new Blob([html],{type:"text/html"}));
    const frame=document.getElementById("game");
    frame.onload=()=>document.getElementById("loading").style.display="none";
    frame.src=url;
  }catch(e){
    document.getElementById("loading").innerHTML="<div><strong>Não foi possível carregar o jogo.</strong><br><small>"+String(e.message||e)+"</small></div>";
  }
})();
</script>
</body>
</html>
